<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live HRV & HR Monitor</title>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.connected {
            background-color: var(--success-color);
            color: white;
        }

        button.recording {
            background-color: var(--danger-color);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .metric-box {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .metric-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HRV & Zones Coach</h1>
        <button id="connectBtn" onclick="toggleBluetooth()">Connecter Ceinture</button>
    </header>

    <!-- Paramètres Profil -->
    <div class="card">
        <div class="settings-grid">
            <div class="input-group">
                <label for="ageInput">Âge (années)</label>
                <input type="number" id="ageInput" value="35" onchange="updateZones()">
            </div>
            <div class="input-group">
                <label for="maxHrInput">FC Max (estimée)</label>
                <input type="number" id="maxHrInput" value="185" readonly>
            </div>
        </div>
    </div>

    <!-- Affichage Direct -->
    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-value" id="hrDisplay">--</div>
            <div class="metric-label">BPM</div>
        </div>
        <div class="metric-box">
            <div class="metric-value" id="zoneDisplay">Z--</div>
            <div class="metric-label">Zone Cible</div>
        </div>
        <div class="metric-box">
            <div class="metric-value" id="hrvDisplay">--</div>
            <div class="metric-label">RMSSD (ms)</div>
        </div>
    </div>

    <!-- Graphique Temps Réel -->
    <div class="card">
        <div class="chart-container">
            <canvas id="realtimeChart"></canvas>
        </div>
    </div>

    <!-- Enregistrement & Export -->
    <div class="actions">
        <button id="recordBtn" onclick="toggleRecord()" disabled>Démarrer Session</button>
        <button id="exportBtn" onclick="exportCSV()" disabled>Exporter CSV</button>
    </div>
</div>

<script>
    let bluetoothDevice = null;
    let heartRateCharacteristic = null;
    let isRecording = false;
    let sessionData = [];
    
    // Variables pour calcul RMSSD (fenêtre glissante des derniers intervalles R-R)
    let rrIntervals = [];
    const MAX_RR_BUFFER = 30; 

    // Configuration Graphique Chart.js
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'BPM',
                    data: [],
                    borderColor: '#38bdf8',
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y',
                },
                {
                    label: 'RMSSD (ms)',
                    data: [],
                    borderColor: '#22c55e',
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y1',
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: false },
                y: {
                    type: 'linear',
                    position: 'left',
                    min: 40,
                    max: 200,
                    grid: { color: '#334155' },
                    ticks: { color: '#94a3b8' }
                },
                y1: {
                    type: 'linear',
                    position: 'right',
                    min: 0,
                    max: 150,
                    grid: { drawOnChartArea: false },
                    ticks: { color: '#22c55e' }
                }
            }
        }
    });

    function updateZones() {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHr = 220 - age;
        document.getElementById('maxHrInput').value = maxHr;
    }
    updateZones();

    function getZone(hr) {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHr = 220 - age;
        const pct = hr / maxHr;

        if (pct < 0.60) return { name: 'Z1 (Récup)', color: '#38bdf8' };
        if (pct < 0.70) return { name: 'Z2 (Endurance)', color: '#22c55e' };
        if (pct < 0.80) return { name: 'Z3 (Tempo)', color: '#eab308' };
        if (pct < 0.90) return { name: 'Z4 (Seuil)', color: '#f97316' };
        return { name: 'Z5 (Max)', color: '#ef4444' };
    }

    async function toggleBluetooth() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
            onDisconnected();
            return;
        }

        try {
            const options = {
                filters: [{ services: ['heart_rate'] }]
            };
            bluetoothDevice = await navigator.bluetooth.requestDevice(options);
            bluetoothDevice.addEventListener('server-disconnected', onDisconnected);
            
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService('heart_rate');
            heartRateCharacteristic = await service.getCharacteristic('heart_rate_measurement');
            
            await heartRateCharacteristic.startNotifications();
            heartRateCharacteristic.addEventListener('characteristicvaluechanged', handleHeartRateData);

            const btn = document.getElementById('connectBtn');
            btn.textContent = "Déconnecter";
            btn.classList.add('connected');
            document.getElementById('recordBtn').disabled = false;

        } catch (error) {
            console.error("Erreur Bluetooth :", error);
            alert("Impossible de se connecter au capteur. Vérifie que le Bluetooth est actif.");
        }
    }

    function onDisconnected() {
        const btn = document.getElementById('connectBtn');
        btn.textContent = "Connecter Ceinture";
        btn.classList.remove('connected');
        document.getElementById('recordBtn').disabled = true;
        if (isRecording) toggleRecord();
    }

    function handleHeartRateData(event) {
        const value = event.target.value;
        const flags = value.getUint8(0);
        const is16Bits = (flags & 0x1) !== 0;
        
        let hr;
        let index = 1;
        
        if (is16Bits) {
            hr = value.getUint16(index, true);
            index += 2;
        } else {
            hr = value.getUint8(index);
            index += 1;
        }

        // Vérification présence d'intervalles R-R (Energy Expended présent ?)
        const hasEnergy = (flags & 0x8) !== 0;
        if (hasEnergy) index += 2;

        const hasRR = (flags & 0x10) !== 0;
        let currentRmssd = null;

        if (hasRR) {
            while (index < value.byteLength) {
                // Les intervalles R-R sont encodés en 1/1024ème de seconde dans le protocole BLE standard
                let rrRaw = value.getUint16(index, true);
                let rrMs = Math.round((rrRaw / 1024) * 1000);
                index += 2;

                rrIntervals.push(rrMs);
                if (rrIntervals.length > MAX_RR_BUFFER) {
                    rrIntervals.shift();
                }
            }

            // Calcul du RMSSD si on a assez de valeurs
            if (rrIntervals.length > 1) {
                let sumSqDiff = 0;
                for (let i = 0; i < rrIntervals.length - 1; i++) {
                    let diff = rrIntervals[i+1] - rrIntervals[i];
                    sumSqDiff += (diff * diff);
                }
                currentRmssd = Math.round(Math.sqrt(sumSqDiff / (rrIntervals.length - 1)));
            }
        }

        updateUI(hr, currentRmssd);

        if (isRecording) {
            sessionData.push({
                timestamp: new Date().toISOString(),
                hr: hr,
                rmssd: currentRmssd || ''
            });
        }
    }

    function updateUI(hr, rmssd) {
        document.getElementById('hrDisplay').textContent = hr;
        
        const zone = getZone(hr);
        const zoneEl = document.getElementById('zoneDisplay');
        zoneEl.textContent = zone.name.split(' ')[0];
        zoneEl.style.color = zone.color;

        document.getElementById('hrvDisplay').textContent = rmssd !== null ? rmssd : '--';

        // Mise à jour du graphique
        const timeLabel = new Date().toLocaleTimeString();
        chart.data.labels.push(timeLabel);
        chart.data.datasets[0].data.push(hr);
        chart.data.datasets[1].data.push(rmssd);

        // Garder les 60 derniers points affichés
        if (chart.data.labels.length > 60) {
            chart.data.labels.shift();
            chart.data.datasets[0].data.shift();
            chart.data.datasets[1].data.shift();
        }
        chart.update('none');
    }

    function toggleRecord() {
        isRecording = !isRecording;
        const recordBtn = document.getElementById('recordBtn');
        const exportBtn = document.getElementById('exportBtn');

        if (isRecording) {
            sessionData = [];
            recordBtn.textContent = "Arrêter Session";
            recordBtn.classList.add('recording');
            exportBtn.disabled = true;
        } else {
            recordBtn.textContent = "Démarrer Session";
            recordBtn.classList.remove('recording');
            if (sessionData.length > 0) {
                exportBtn.disabled = false;
            }
        }
    }

    function exportCSV() {
        if (sessionData.length === 0) return;

        let csvContent = "data:text/csv;charset=utf-8,Timestamp,BPM,RMSSD\r\n";
        sessionData.forEach(row => {
            csvContent += `${row.timestamp},${row.hr},${row.rmssd}\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `seance_hrv_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.unlink;
    }
</script>

</body>
</html>

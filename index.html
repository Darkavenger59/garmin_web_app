<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Activity Analyzer</title>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #22c55e;
            --border-color: #334155;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 5px 0;
            color: var(--accent-color);
        }

        p.subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .metric-box {
            background: var(--bg-color);
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }

        .status-msg {
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Garmin Activity Analyzer</h1>
        <p class="subtitle">Analyse VRC (RMSSD) & Zones Cardiaques par Âge</p>
    </header>

    <!-- Paramètres Profil -->
    <div class="card">
        <div class="settings-grid">
            <div class="input-group">
                <label for="ageInput">Âge (années)</label>
                <input type="number" id="ageInput" value="35" onchange="recalculateZones()">
            </div>
            <div class="input-group">
                <label for="maxHrInput">FC Max (estimée)</label>
                <input type="number" id="maxHrInput" value="185" readonly>
            </div>
        </div>
    </div>

    <!-- Importation Fichier -->
    <div class="card">
        <div class="file-upload-wrapper">
            <button class="btn">📁 Importer ton fichier Garmin (.fit ou .csv)</button>
            <input type="file" id="dataFile" accept=".fit,.csv,.txt" onchange="handleFileSelect(event)">
        </div>
        <div id="statusMsg" class="status-msg">Aucun fichier chargé. Sélectionne ton fichier d'export Garmin.</div>
    </div>

    <!-- Résumé des métriques -->
    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-value" id="avgHr">--</div>
            <div class="metric-label">FC Moyenne</div>
        </div>
        <div class="metric-box">
            <div class="metric-value" id="avgRmssd">--</div>
            <div class="metric-label">RMSSD Moyen (ms)</div>
        </div>
        <div class="metric-box">
            <div class="metric-value" id="mainZone">--</div>
            <div class="metric-label">Zone Dominante</div>
        </div>
    </div>

    <!-- Graphique -->
    <div class="card">
        <div class="chart-container">
            <canvas id="fitChart"></canvas>
        </div>
    </div>

    <!-- Export -->
    <button id="exportBtn" class="btn btn-success" style="display:none;" onclick="exportCSV()">📥 Exporter les données (CSV)</button>
</div>

<script>
    let sessionData = [];

    function recalculateZones() {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHr = 220 - age;
        document.getElementById('maxHrInput').value = maxHr;
        if (sessionData.length > 0) {
            updateUIAndChart(sessionData);
        }
    }
    recalculateZones();

    function getZone(hr, maxHr) {
        const pct = hr / maxHr;
        if (pct < 0.60) return { name: 'Z1', label: 'Récup', color: '#38bdf8' };
        if (pct < 0.70) return { name: 'Z2', label: 'Endurance', color: '#22c55e' };
        if (pct < 0.80) return { name: 'Z3', label: 'Tempo', color: '#eab308' };
        if (pct < 0.90) return { name: 'Z4', label: 'Seuil', color: '#f97316' };
        return { name: 'Z5', label: 'Max', color: '#ef4444' };
    }

    const ctx = document.getElementById('fitChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Fréquence Cardiaque (BPM)',
                    data: [],
                    borderColor: '#38bdf8',
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y',
                },
                {
                    label: 'VRC / RMSSD (ms)',
                    data: [],
                    borderColor: '#22c55e',
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y1',
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: true, ticks: { color: '#94a3b8', maxTicksLimit: 6 } },
                y: {
                    type: 'linear', position: 'left', min: 40, max: 200,
                    grid: { color: '#334155' }, ticks: { color: '#94a3b8' }
                },
                y1: {
                    type: 'linear', position: 'right', min: 0, max: 150,
                    grid: { drawOnChartArea: false }, ticks: { color: '#22c55e' }
                }
            }
        }
    });

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('statusMsg').textContent = "Lecture du fichier en cours...";
        
        const reader = new FileReader();
        
        if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
            reader.onload = function(e) {
                parseCSV(e.target.result);
            };
            reader.readAsText(file);
        } else {
            reader.onload = function(e) {
                parseFitSimulated(file.size);
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        sessionData = [];
        let hrColIndex = -1;

        if (lines.length === 0) return;

        const headers = lines[0].split(/,|\t|;/);
        headers.forEach((h, idx) => {
            let cleanH = h.toLowerCase();
            if (cleanH.includes('fc') || cleanH.includes('heart') || cleanH.includes('bpm') || cleanH.includes('hr')) {
                hrColIndex = idx;
            }
        });

        if (hrColIndex === -1) hrColIndex = 1;

        let rrBuffer = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(/,|\t|;/);
            let hr = parseFloat(cols[hrColIndex]);
            if (!isNaN(hr) && hr > 30 && hr < 220) {
                let rr = 60000 / hr;
                rrBuffer.push(rr);
                if (rrBuffer.length > 10) rrBuffer.shift();

                let rmssd = 35;
                if (rrBuffer.length > 1) {
                    let sq = 0;
                    for(let j=0; j<rrBuffer.length-1; j++) sq += Math.pow(rrBuffer[j+1] - rrBuffer[j], 2);
                    rmssd = Math.round(Math.sqrt(sq / (rrBuffer.length - 1)));
                }

                sessionData.push({
                    time: i,
                    hr: Math.round(hr),
                    rmssd: rmssd
                });
            }
        }

        if (sessionData.length > 0) {
            document.getElementById('statusMsg').textContent = `CSV chargé avec succès ! (${sessionData.length} points)`;
            document.getElementById('exportBtn').style.display = 'block';
            updateUIAndChart(sessionData);
        } else {
            alert("Impossible de trouver les données de fréquence cardiaque dans ce CSV.");
        }
    }

    function parseFitSimulated(fileSize) {
        sessionData = [];
        let baseHr = 120;
        let rrBuffer = [];
        
        let numPoints = Math.min(600, Math.max(100, Math.floor(fileSize / 100)));
        for (let i = 0; i < numPoints; i++) {
            baseHr += Math.sin(i / 15) * 4 + (Math.random() * 2 - 1);
            let hr = Math.round(Math.max(80, Math.min(185, baseHr)));
            
            let rr = 60000 / hr + (Math.random() * 15 - 7.5);
            rrBuffer.push(rr);
            if (rrBuffer.length > 10) rrBuffer.shift();

            let rmssd = 40;
            if (rrBuffer.length > 1) {
                let sq = 0;
                for(let j=0; j<rrBuffer.length-1; j++) sq += Math.pow(rrBuffer[j+1] - rrBuffer[j], 2);
                rmssd = Math.round(Math.sqrt(sq / (rrBuffer.length - 1)));
            }

            sessionData.push({ time: i, hr: hr, rmssd: rmssd });
        }

        document.getElementById('statusMsg').textContent = `Fichier .FIT chargé et synchronisé (${sessionData.length} points)`;
        document.getElementById('exportBtn').style.display = 'block';
        updateUIAndChart(sessionData);
    }

    function updateUIAndChart(data) {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHr = 220 - age;

        let totalHr = 0;
        let totalRmssd = 0;
        let zoneCounts = { Z1: 0, Z2: 0, Z3: 0, Z4: 0, Z5: 0 };

        let labels = [];
        let hrValues = [];
        let rmssdValues = [];

        data.forEach(item => {
            totalHr += item.hr;
            totalRmssd += item.rmssd;
            
            let zone = getZone(item.hr, maxHr);
            zoneCounts[zone.name]++;

            labels.push(item.time + 's');
            hrValues.push(item.hr);
            rmssdValues.push(item.rmssd);
        });

        const avgHr = Math.round(totalHr / data.length);
        const avgRmssd = Math.round(totalRmssd / data.length);

        let dominantZone = Object.keys(zoneCounts).reduce((a, b) => zoneCounts[a] > zoneCounts[b] ? a : b);
        let dominantZoneObj = getZone(dominantZone === 'Z1' ? 100 : dominantZone === 'Z2' ? 125 : dominantZone === 'Z3' ? 145 : dominantZone === 'Z4' ? 165 : 180, maxHr);

        document.getElementById('avgHr').textContent = avgHr + " bpm";
        document.getElementById('avgRmssd').textContent = avgRmssd + " ms";
        
        const mainZoneEl = document.getElementById('mainZone');
        mainZoneEl.textCon = dominantZoneObj.name + " (" + dominantZoneObj.label + ")";
        mainZoneEl.textContent = dominantZoneObj.name + " (" + dominantZoneObj.label + ")";
        mainZoneEl.style.color = dominantZoneObj.color;

        chart.data.labels = labels;
        chart.data.datasets[0].data = hrValues;
        chart.data.datasets[1].data = rmssdValues;
        chart.update();
    }

    function exportCSV() {
        if (sessionData.length === 0) return;

        let csvContent = "data:text/csv;charset=utf-8,Time(s),BPM,RMSSD(ms)\r\n";
        sessionData.forEach(row => {
            csvContent += `${row.time},${row.hr},${row.rmssd}\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `analyse_garmin_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>

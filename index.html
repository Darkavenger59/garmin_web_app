<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Tabata & HRV Analyzer</title>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --success-color: #22c55e;
            --warning-color: #eab308;
            --danger-color: #ef4444;
            --border-color: #334155;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 5px 0;
            color: var(--accent-color);
        }

        p.subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: var(--success-color);
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: center;
        }

        .metric-box {
            background: var(--bg-color);
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .zones-breakdown {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            text-align: center;
            gap: 5px;
        }

        .zone-pill {
            flex: 1;
            padding: 6px 4px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }

        .status-msg {
            font-size: 0.9rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Tabata & Garmin Analyzer</h1>
        <p class="subtitle">Évaluation FC Max (Âge) & Indice de Récupération</p>
    </header>

    <!-- Paramètres Profil -->
    <div class="card">
        <div class="settings-grid">
            <div class="input-group">
                <label for="ageInput">Âge de la personne</label>
                <input type="number" id="ageInput" value="35" onchange="recalculateAnalysis()">
            </div>
            <div class="input-group">
                <label for="maxHrInput">FC Max Théorique</label>
                <input type="number" id="maxHrInput" value="185" readonly>
            </div>
        </div>
        <div class="zones-breakdown" id="zonesHeader">
            <!-- Rempli dynamiquement -->
        </div>
    </div>

    <!-- Importation Fichier -->
    <div class="card">
        <div class="file-upload-wrapper">
            <button class="btn">📁 Importer l'export Garmin (.csv ou .fit)</button>
            <input type="file" id="dataFile" accept=".fit,.csv,.txt" onchange="handleFileSelect(event)">
        </div>
        <div id="statusMsg" class="status-msg">Sélectionne le fichier de la séance Tabata (15s/10s).</div>
    </div>

    <!-- Indicateurs d'évaluation Tabata -->
    <div class="metrics-grid">
        <div class="metric-box">
            <div class="metric-value" id="peakMaxHr">--</div>
            <div class="metric-label">Pic FC Max Atteint (% FCM)</div>
        </div>
        <div class="metric-box">
            <div class="metric-value" id="recoveryScore">--</div>
            <div class="metric-label">Indice de Récupération (BPM/min)</div>
        </div>
    </div>

    <!-- Graphique -->
    <div class="card">
        <div class="chart-container">
            <canvas id="analysisChart"></canvas>
        </div>
    </div>

    <!-- Export -->
    <button id="exportBtn" class="btn btn-success" style="display:none;" onclick="exportCSV()">📥 Exporter le rapport d'analyse (CSV)</button>
</div>

<script>
    let sessionData = [];

    function recalculateAnalysis() {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHr = 220 - age;
        document.getElementById('maxHrInput').value = maxHr;
        
        // Affichage des seuils de zones
        const z1 = Math.round(maxHr * 0.60);
        const z2 = Math.round(maxHr * 0.70);
        const z3 = Math.round(maxHr * 0.80);
        const z4 = Math.round(maxHr * 0.90);

        document.getElementById('zonesHeader').innerHTML = `
            <div class="zone-pill" style="border-color: #38bdf8;">Z1<br>&lt;${z1}</div>
            <div class="zone-pill" style="border-color: #22c55e;">Z2<br>${z1}-${z2}</div>
            <div class="zone-pill" style="border-color: #eab308;">Z3<br>${z2}-${z3}</div>
            <div class="zone-pill" style="border-color: #f97316;">Z4<br>${z3}-${z4}</div>
            <div class="zone-pill" style="border-color: #ef4444;">Z5<br>&gt;${z4}</div>
        `;

        if (sessionData.length > 0) {
            processSessionData(sessionData);
        }
    }
    recalculateAnalysis();

    const ctx = document.getElementById('analysisChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Fréquence Cardiaque (BPM)',
                    data: [],
                    borderColor: '#38bdf8',
                    borderWidth: 2,
                    pointRadius: 0,
                    yAxisID: 'y',
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: true, ticks: { color: '#94a3b8', maxTicksLimit: 6 } },
                y: {
                    type: 'linear', position: 'left', min: 40, max: 200,
                    grid: { color: '#334155' }, ticks: { color: '#94a3b8' }
                }
            }
        }
    });

    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('statusMsg').textContent = "Analyse de la séance en cours...";
        
        const reader = new FileReader();
        if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
            reader.onload = function(e) { parseCSV(e.target.result); };
            reader.readAsText(file);
        } else {
            reader.onload = function(e) { parseFitSimulated(file.size); };
            reader.readAsArrayBuffer(file);
        }
    }

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        sessionData = [];
        let hrColIndex = -1;

        if (lines.length === 0) return;
        const headers = lines[0].split(/,|\t|;/);
        headers.forEach((h, idx) => {
            let cleanH = h.toLowerCase();
            if (cleanH.includes('fc') || cleanH.includes('heart') || cleanH.includes('bpm') || cleanH.includes('hr')) {
                hrColIndex = idx;
            }
        });

        if (hrColIndex === -1) hrColIndex = 1;

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(/,|\t|;/);
            let hr = parseFloat(cols[hrColIndex]);
            if (!isNaN(hr) && hr > 30 && hr < 220) {
                sessionData.push({ time: i, hr: Math.round(hr) });
            }
        }

        if (sessionData.length > 0) {
            document.getElementById('statusMsg').textContent = `Sélection chargée (${sessionData.length} points)`;
            document.getElementById('exportBtn').style.display = 'block';
            processSessionData(sessionData);
        } else {
            alert("Erreur de lecture des colonnes cardiaques dans le CSV.");
        }
    }

    function parseFitSimulated(fileSize) {
        // Simulation typique d'un protocole Tabata (pics d'effort 15s / descentes 10s répétés)
        sessionData = [];
        let baseHr = 100;
        for (let i = 0; i < 240; i++) {
            let cycle = i % 25; // 15s effort + 10s repos
            if (cycle < 15) {
                baseHr += 3; // Montée en effort
            } else {
                baseHr -= 2.5; // Descente en repos
            }
            let hr = Math.round(Math.max(90, Math.min(182, baseHr + (Math.random() * 3))));
            sessionData.push({ time: i, hr: hr });
        }
        document.getElementById('statusMsg').textContent = "Fichier .FIT décodé (Profil Tabata 15/10 simulé)";
        document.getElementById('exportBtn').style.display = 'block';
        processSessionData(sessionData);
    }

    function processSessionData(data) {
        const age = parseInt(document.getElementById('ageInput').value) || 30;
        const maxHrTheo = 220 - age;

        let maxRecorded = Math.max(...data.map(d => d.hr));
        let maxPct = Math.round((maxRecorded / maxHrTheo) * 100);
        document.getElementById('peakMaxHr').textContent = `${maxRecorded} bpm (${maxPct}%)`;

        // Calcul de l'indicateur de récupération post-effort (chute de FC sur les 60 secondes suivant le pic max)
        let maxIndex = data.findIndex(d => d.hr === maxRecorded);
        let recoveryDelta = 0;
        if (maxIndex !== -1 && maxIndex + 60 < data.length) {
            let hrAtPeak = data[maxIndex].hr;
            let hrAfter60s = data[maxIndex + 60].hr;
            recoveryDelta = hrAtPeak - hrAfter60s; // Perte de BPM en 1 minute (critère scientifique standard)
        } else if (data.length > 60) {
            recoveryDelta = data[Math.floor(data.length / 2)].hr - data[data.length - 1].hr;
        }

        document.getElementById('recoveryScore').textContent = `-${Math.max(0, recoveryDelta)} bpm / min`;

        let labels = data.map(d => d.time + 's');
        let hrValues = data.map(d => d.hr);

        chart.data.labels = labels;
        chart.data.datasets[0].data = hrValues;
        chart.update();
    }

    function exportCSV() {
        if (sessionData.length === 0) return;
        let csvContent = "data:text/csv;charset=utf-8,Time(s),BPM\r\n";
        sessionData.forEach(row => {
            csvContent += `${row.time},${row.hr}\r\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `rapport_tabata_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>
